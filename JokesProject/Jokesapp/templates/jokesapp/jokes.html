<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Jokes Generator</title>
    <style>
        /* Modern Reset & Design Tokens */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #ffd700;
            --text-dark: #2d3748;
            --text-light: #718096;
            --shadow-depth: 0 20px 60px rgba(0, 0, 0, 0.15);
            --shadow-button: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Layout Container */
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: var(--shadow-depth);
            padding: 40px;
            max-width: 550px;
            width: 100%;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Styling */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-light);
            font-size: 1em;
        }

        /* Joke Presentation Card */
        .joke-box {
            background: var(--primary-gradient);
            border-radius: 16px;
            padding: 35px;
            margin: 25px 0;
            color: #ffffff;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.25);
            text-align: center;
        }

        .setup {
            font-size: 1.25em;
            font-weight: 500;
            line-height: 1.6;
            opacity: 0.95;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
            margin: 20px auto;
            width: 60%;
        }

        .punchline {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1.4;
            animation: revealPunchline 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes revealPunchline {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Interactive Elements */
        .button-container {
            text-align: center;
            margin-top: 25px;
        }

        .btn-refresh {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            padding: 14px 45px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-button);
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .btn-refresh:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-refresh:active {
            transform: translateY(-1px);
        }

        /* Responsive Breakpoints */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .joke-box {
                padding: 25px 20px;
            }

            .setup {
                font-size: 1.1em;
            }

            .punchline {
                font-size: 1.25em;
            }

            .btn-refresh {
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <header class="header">
            <h1>😂 Joke of the Day</h1>
            <p>Get a random joke to brighten your day</p>
        </header>

        <section class="joke-box" aria-live="polite">
            <div class="setup">{{ setup }}</div>
            <div class="divider"></div>
            <div class="punchline">{{ punchline }}</div>
        </section>

        <div class="button-container">
            <a href="{% url 'jokes' %}" class="btn-refresh">Get Another Joke</a>
        </div>
    </main>

</body>
</html>
